<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner PDF</title>
<style>
html,body{margin:0;height:100%;background:#000;font:600 16px system-ui,sans-serif;color:#fff;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#f{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px #e5322d;transition:box-shadow .2s}
#f.g{box-shadow:inset 0 0 0 10px #22c55e}
#w{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#w.on{opacity:.85;transition:none}
#b{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000a)}
button{font:inherit;color:#fff;background:#222c;border:1px solid #fff5;border-radius:999px;padding:12px 20px}
button:disabled{opacity:.35}
#m{position:absolute;top:24px;left:0;right:0;text-align:center;text-shadow:0 1px 4px #000}
#pdf,#dl{background:#22c55e;border-color:#22c55e;color:#04220f}
.r video,.r #f,.r #w,.r #m,.r #b{display:none}
#r{position:absolute;inset:0;overflow:auto;padding:28px;box-sizing:border-box;text-align:center}
#r h1{font-size:20px;margin:0 0 18px}
#qr{display:inline-block;background:#fff;padding:14px;border-radius:12px}
#qr svg{display:block;width:220px;height:220px}
#g{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:24px 0}
#g div{position:relative}#g img{height:170px;border-radius:6px;display:block}
#g button{position:absolute;top:6px;right:6px;padding:2px 9px}
#r a{color:#9ab}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="f"></div><div id="w"></div>
<div id="m">Enquadre o documento inteiro</div>
<div id="b">
  <button id="bw">P&B</button>
  <button id="undo" disabled>Desfazer</button>
  <button id="pdf" disabled>Gerar PDF (0)</button>
</div>
<div id="r" hidden>
  <h1>Scanner PDF</h1>
  <div id="qr"></div>
  <p id="qt">Aponte a câmera do celular para o QR code</p>
  <div id="g"></div>
  <button id="dl" disabled>Baixar PDF (0)</button>
  <p><a href="#s=local">Usar a câmera deste aparelho</a></p>
</div>
<script>
const API='https://snannerapi.williamamorim126.workers.dev'; // URL do Worker da API
const $=id=>document.getElementById(id), v=$('v'), f=$('f'), pages=[];
const code=(location.hash.match(/^#s=(\w+)/)||[])[1], up=code&&code!=='local';
const b64=d=>Uint8Array.from(atob(d.split(',')[1]),c=>c.charCodeAt(0));
const sc=document.createElement('canvas'), sx=sc.getContext('2d',{willReadFrequently:true});
let bw=true, last=null, since=0, armed=true, busy=false;

// Detecta a maior região clara no centro; "ok" só se estiver inteira dentro do quadro
function detect(){
  if(!v.videoWidth) return null;
  const w=160, h=Math.round(w*v.videoHeight/v.videoWidth), N=w*h;
  sc.width=w; sc.height=h; sx.drawImage(v,0,0,w,h);
  const d=sx.getImageData(0,0,w,h).data, g=new Uint8Array(N), hi=new Array(256).fill(0);
  for(let i=0;i<N;i++){g[i]=(d[4*i]*77+d[4*i+1]*150+d[4*i+2]*29)>>8; hi[g[i]]++}
  let sum=0; for(let t=0;t<256;t++) sum+=t*hi[t];
  let sb=0, wb=0, best=0, th=128;
  for(let t=0;t<256;t++){
    wb+=hi[t]; if(!wb) continue; const wf=N-wb; if(!wf) break;
    sb+=t*hi[t]; const mb=sb/wb, mf=(sum-sb)/wf, s=wb*wf*(mb-mf)**2;
    if(s>best){best=s; th=t}
  }
  const seen=new Uint8Array(N); let top=null;
  for(let s0=0;s0<N;s0++){
    if(seen[s0]||g[s0]<=th) continue;
    const st=[s0]; seen[s0]=1;
    const c={n:0,x0:w,x1:0,y0:h,y1:0,tl:[0,1e9],br:[0,-1e9],tr:[0,-1e9],bl:[0,1e9]};
    while(st.length){
      const p=st.pop(), x=p%w, y=(p/w)|0, a=x+y, b=x-y; c.n++;
      if(x<c.x0)c.x0=x; if(x>c.x1)c.x1=x; if(y<c.y0)c.y0=y; if(y>c.y1)c.y1=y;
      if(a<c.tl[1])c.tl=[p,a]; if(a>c.br[1])c.br=[p,a];
      if(b>c.tr[1])c.tr=[p,b]; if(b<c.bl[1])c.bl=[p,b];
      for(const q of [p-1,p+1,p-w,p+w]){
        if(q<0||q>=N||(q%w-x>1)||(x-q%w>1)||seen[q]||g[q]<=th) continue;
        seen[q]=1; st.push(q);
      }
    }
    if(!top||c.n>top.n) top=c;
  }
  if(!top||top.n<N*.25) return null;
  const P=[top.tl,top.tr,top.br,top.bl].map(k=>[(k[0]%w)/w,((k[0]/w)|0)/h]);
  const A=Math.abs(P.reduce((s,p,i)=>{const q=P[(i+1)%4];return s+p[0]*q[1]-q[0]*p[1]},0))/2*N;
  const inside=top.x0>1&&top.y0>1&&top.x1<w-2&&top.y1<h-2;
  return inside&&top.n/A>.75?P:null;
}

// Efeito "scanner a laser": tira sombra e fundo, papel branco e texto bem preto
function clean(D,W,H,bw){
  const B=32, gw=Math.ceil(W/B), gh=Math.ceil(H/B), G=new Uint8Array(W*H); let bg=new Float32Array(gw*gh);
  const K=i=>((i/W/B)|0)*gw+(((i%W)/B)|0);
  for(let i=0;i<W*H;i++){const e=i*4; G[i]=(D[e]*77+D[e+1]*150+D[e+2]*29)>>8; const k=K(i); if(G[i]>bg[k])bg[k]=G[i]}
  for(let r=0;r<2;r++){
    const n=new Float32Array(bg.length);
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      let t=0,c=0;
      for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++){const yy=y+dy,xx=x+dx; if(yy>=0&&yy<gh&&xx>=0&&xx<gw){t+=bg[yy*gw+xx];c++}}
      n[y*gw+x]=t/c;
    }
    bg=n;
  }
  const f=(v,b)=>((v/b-.55)/.3)*255;
  for(let i=0;i<W*H;i++){
    const e=i*4, b=Math.max(bg[K(i)]*.97,40);
    if(bw) D[e]=D[e+1]=D[e+2]=f(G[i],b); else for(let c=0;c<3;c++) D[e+c]=f(D[e+c],b);
  }
}

function warp(P,c){
  const W0=c.width, H0=c.height, src=c.getContext('2d').getImageData(0,0,W0,H0).data;
  const [tl,tr,br,bl]=P.map(p=>[p[0]*W0,p[1]*H0]), L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=(L(tl,tr)+L(bl,br))/2, H=(L(tl,bl)+L(tr,br))/2, k=Math.min(1,2600/Math.max(W,H));
  W=Math.round(W*k); H=Math.round(H*k);
  const o=document.createElement('canvas'); o.width=W; o.height=H;
  const ox=o.getContext('2d'), out=ox.createImageData(W,H), D=out.data;
  for(let j=0;j<H;j++){
    const t=.01+.98*j/H;
    for(let i=0;i<W;i++){
      const u=.01+.98*i/W;
      const px=(1-t)*((1-u)*tl[0]+u*tr[0])+t*((1-u)*bl[0]+u*br[0]);
      const py=(1-t)*((1-u)*tl[1]+u*tr[1])+t*((1-u)*bl[1]+u*br[1]);
      const s=((py|0)*W0+(px|0))*4, e=(j*W+i)*4;
      D[e]=src[s]; D[e+1]=src[s+1]; D[e+2]=src[s+2]; D[e+3]=255;
    }
  }
  clean(D,W,H,bw);
  ox.putImageData(out,0,0); return o;
}

// Tira 4 quadros em resolução total e fica com o mais nítido (evita foco borrado)
async function shoot(){
  let best, bs=-1;
  for(let i=0;i<4;i++){
    const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
    c.width=v.videoWidth; c.height=v.videoHeight; x.drawImage(v,0,0);
    const d=x.getImageData((c.width/2-300)|0,(c.height/2-300)|0,600,600).data; let sh=0;
    for(let e=1;e<d.length-4;e+=4) sh+=Math.abs(d[e]-d[e+4]);
    if(sh>bs){bs=sh; best=c}
    await new Promise(r=>setTimeout(r,120));
  }
  return best;
}

async function capture(P){
  busy=true; armed=false;
  const c=warp(P,await shoot());
  let url=c.toDataURL('image/jpeg',.88); if(url.length>1.8e6) url=c.toDataURL('image/jpeg',.7);
  const pg={w:c.width,h:c.height,jpg:b64(url)};
  pages.push(pg); ui(); navigator.vibrate&&navigator.vibrate(60);
  if(up) pg.id=fetch(`${API}/${code}`,{method:'POST',body:url})
    .then(async r=>{if(!r.ok) throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,70)); return (await r.json()).id})
    .catch(e=>{$('m').textContent='Falha ao enviar ('+(API.includes('SEU-WORKER')?'configure a URL do Worker no index.html':e.message)+'). Página salva só no celular'});
  $('w').classList.add('on'); setTimeout(()=>$('w').classList.remove('on'),60);
  busy=false;
}

function ui(){
  $('pdf').textContent=`Gerar PDF (${pages.length})`;
  $('pdf').disabled=$('undo').disabled=!pages.length;
  $('m').textContent=pages.length?(up?'Enviada ao computador. Vire a folha':'Página salva. Vire a folha ou gere o PDF'):'Enquadre o documento inteiro';
}

code&&setInterval(()=>{
  if(busy) return;
  const P=detect();
  f.className=P?'g':'';
  if(!P){last=null; armed=true; return}
  if(!armed) return;
  const now=performance.now();
  if(last&&P.every((p,i)=>Math.abs(p[0]-last[i][0])<.012&&Math.abs(p[1]-last[i][1])<.012)){
    if(now-since>900) capture(P);
  } else {since=now; last=P}
},150);

// PDF mínimo: uma imagem JPEG por página, sem bibliotecas
function makePDF(pages){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b); parts.push(b); len+=b.length};
  const obj=(n,head,stream)=>{offs[n]=len; add(`${n} 0 obj\n${head}\n`); if(stream){add('stream\n');add(stream);add('\nendstream\n')} add('endobj\n')};
  add('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,`<</Type/Pages/Count ${pages.length}/Kids[${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}]>>`);
  pages.forEach((p,i)=>{
    const b=3+i*3, W=595, H=Math.round(595*p.h/p.w), c=`q ${W} 0 0 ${H} 0 0 cm /I Do Q`;
    obj(b,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Contents ${b+1} 0 R/Resources<</XObject<</I ${b+2} 0 R>>>>>>`);
    obj(b+1,`<</Length ${c.length}>>`,c);
    obj(b+2,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.jpg.length}>>`,p.jpg);
  });
  const x=len;
  add(`xref\n0 ${offs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  add(`trailer\n<</Size ${offs.length}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

async function save(p){
  const file=new File([makePDF(p)],'scan.pdf',{type:'application/pdf'});
  if(code&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]}); return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download='scan.pdf'; a.click();
};
$('bw').onclick=()=>{bw=!bw; $('bw').textContent=bw?'P&B':'Cor'};
$('pdf').onclick=()=>save(pages);
$('undo').onclick=()=>{const p=pages.pop(); p.id&&p.id.then(i=>i&&fetch(`${API}/${code}/${i}`,{method:'DELETE'})); ui()};

if(code)navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:4096}}})
  .then(s=>{v.srcObject=s; s.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{})})
  .catch(()=>$('m').textContent='Permita o acesso à câmera (precisa de HTTPS)');
onhashchange=()=>location.reload();
if(!code)receiver();

// Modo computador: mostra o QR e recebe as páginas do celular
function receiver(){
  document.body.className='r'; $('r').hidden=false;
  let rc=localStorage.rc;
  if(!rc) localStorage.rc=rc=[...crypto.getRandomValues(new Uint8Array(20))].map(b=>(b%36).toString(36)).join('');
  const T=$('qt').textContent, have=new Map(), list=()=>[...have].sort((a,b)=>a[0]-b[0]).map(e=>e[1]),
    cnt=()=>{$('dl').textContent=`Baixar PDF (${have.size})`; $('dl').disabled=!have.size};
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload=()=>{const q=qrcode(0,'M'); q.addData(location.href.split('#')[0]+'#s='+rc); q.make(); $('qr').innerHTML=q.createSvgTag(5,0)};
  document.head.append(s);
  async function sync(){
    const r=await fetch(`${API}/${rc}`);
    if(!r.ok) throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,70));
    const ids=await r.json();
    for(const [id,p] of have) if(!ids.includes(id)){p.el.remove(); have.delete(id)}
    for(const id of ids) if(!have.has(id)){
      const d=await (await fetch(`${API}/${rc}/${id}`)).text(), im=new Image(),
        el=document.createElement('div'), x=document.createElement('button');
      im.src=d; await im.decode();
      x.textContent='✕';
      x.onclick=()=>{fetch(`${API}/${rc}/${id}`,{method:'DELETE'}); el.remove(); have.delete(id); cnt()};
      el.append(im,x); $('g').append(el);
      have.set(id,{w:im.naturalWidth,h:im.naturalHeight,jpg:b64(d),el});
    }
    cnt();
  }
  (async function loop(){
    try{await sync(); $('qt').textContent=T}
    catch(e){$('qt').textContent='Sem conexão com o servidor ('+(API.includes('SEU-WORKER')?'configure a URL do Worker no index.html':e.message)+')'}
    setTimeout(loop,2000);
  })();
  $('dl').onclick=()=>save(list());
}
</script>
</body>
</html>
